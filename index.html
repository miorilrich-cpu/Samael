<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miori Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt & Quicksand) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอนน่ารักๆ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Prompt', 'Quicksand', sans-serif;
            background-color: #fff5f7;
        }
    </style>
</head>
<body class="bg-pink-50 text-gray-700 flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[850px] sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col justify-between border-4 border-pink-100">

        <div>
            <!-- Header -->
            <header class="flex items-center justify-between px-6 py-4 bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-pink-100">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-full bg-pink-100 border-2 border-pink-300 flex items-center justify-center overflow-hidden shadow-sm">
                        <span class="text-2xl">🐰</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-pink-700 tracking-wide font-['Quicksand']">Miori Studio</h1>
                        <p class="text-xs text-pink-400 flex items-center gap-1">
                            <i class="fa-solid fa-heart text-[10px]"></i> Welcome to my shop
                        </p>
                    </div>
                </div>
                <button class="text-pink-500 text-xl p-2 focus:outline-none hover:bg-pink-50 rounded-full transition">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </header>

            <!-- Main Content Area -->
            <main class="p-4 space-y-6">
                
                <!-- Banner Section (ขนาดสัดส่วน 1122 x 495) -->
                <div class="relative rounded-2xl overflow-hidden shadow-md border border-pink-100 group">
                    <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1122&h=495&auto=format&fit=crop" 
                         alt="Banner 1122x495" 
                         class="w-full h-[180px] object-cover group-hover:scale-105 transition duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-pink-900/30 via-transparent to-transparent flex flex-col justify-end p-4 text-white">
                        <div class="bg-white/80 backdrop-blur-md text-pink-700 px-4 py-2 rounded-xl inline-flex items-center justify-between shadow-sm">
                            <span class="font-semibold text-sm">รับทำป้ายพาสเทลน่ารักๆ</span>
                            <span class="text-xs bg-pink-500 text-white px-2 py-0.5 rounded-full font-bold">เริ่มต้น 59.- ♡</span>
                        </div>
                    </div>
                </div>

                <!-- บริการของเรา (Services) -->
                <section class="space-y-3">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="font-semibold text-pink-700 flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> บริการของเรา
                        </h2>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <!-- Service 1 -->
                        <div class="bg-pink-50/60 border border-pink-100 rounded-2xl p-3 text-center flex flex-col items-center justify-between hover:bg-pink-100/50 transition cursor-pointer shadow-sm">
                            <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-pink-500 text-lg mb-2 border border-pink-100">
                                <i class="fa-solid fa-cube"></i>
                            </div>
                            <span class="text-xs font-medium text-pink-800">Block</span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-pink-300 mt-1"></i>
                        </div>
                        <!-- Service 2 -->
                        <div class="bg-pink-50/60 border border-pink-100 rounded-2xl p-3 text-center flex flex-col items-center justify-between hover:bg-pink-100/50 transition cursor-pointer shadow-sm">
                            <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-pink-500 text-lg mb-2 border border-pink-100">
                                <i class="fa-solid fa-paintbrush"></i>
                            </div>
                            <span class="text-xs font-medium text-pink-800">Toon</span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-pink-300 mt-1"></i>
                        </div>
                        <!-- Service 3 -->
                        <div class="bg-pink-50/60 border border-pink-100 rounded-2xl p-3 text-center flex flex-col items-center justify-between hover:bg-pink-100/50 transition cursor-pointer shadow-sm">
                            <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-pink-500 text-lg mb-2 border border-pink-100">
                                <i class="fa-solid fa-gem"></i>
                            </div>
                            <span class="text-xs font-medium text-pink-800">Decor</span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-pink-300 mt-1"></i>
                        </div>
                    </div>
                </section>

                <!-- ตัวอย่างผลงาน (Portfolio - ขนาด 320x320) -->
                <section class="space-y-3">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="font-semibold text-pink-700 flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-images text-pink-400"></i> ตัวอย่างผลงาน
                        </h2>
                        <a href="#" class="text-xs text-pink-400 hover:text-pink-600 transition">ดูทั้งหมด ></a>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <!-- Item 1 (320x320) -->
                        <div class="rounded-2xl overflow-hidden border border-pink-100 shadow-sm bg-pink-50/30 aspect-square">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=320&h=320&auto=format&fit=crop" 
                                 alt="Work 320x320" 
                                 class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <!-- Item 2 (320x320) -->
                        <div class="rounded-2xl overflow-hidden border border-pink-100 shadow-sm bg-pink-50/30 aspect-square">
                            <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=320&h=320&auto=format&fit=crop" 
                                 alt="Work 320x320" 
                                 class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <!-- Item 3 (320x320) -->
                        <div class="rounded-2xl overflow-hidden border border-pink-100 shadow-sm bg-pink-50/30 aspect-square">
                            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=320&h=320&auto=format&fit=crop" 
                                 alt="Work 320x320" 
                                 class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <!-- Item 4 (320x320) -->
                        <div class="rounded-2xl overflow-hidden border border-pink-100 shadow-sm bg-pink-50/30 aspect-square">
                            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=320&h=320&auto=format&fit=crop" 
                                 alt="Work 320x320" 
                                 class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                    </div>
                </section>

                <!-- Contact Me (Facebook & Line) -->
                <section class="space-y-3 pt-2">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="font-semibold text-pink-700 flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-address-book text-pink-400"></i> Contact Me
                        </h2>
                    </div>
                    <div class="flex justify-around items-center bg-pink-50/50 border border-pink-100 rounded-2xl py-4 px-2">
                        <!-- Line -->
                        <a href="#" class="flex flex-col items-center group">
                            <div class="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition">
                                <i class="fa-brands fa-line"></i>
                            </div>
                            <span class="text-xs mt-2 text-gray-600 font-medium">LINE</span>
                        </a>
                        <!-- Facebook -->
                        <a href="#" class="flex flex-col items-center group">
                            <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition">
                                <i class="fa-brands fa-facebook-f"></i>
                            </div>
                            <span class="text-xs mt-2 text-gray-600 font-medium">Facebook</span>
                        </a>
                    </div>
                </section>

            </main>
        </div>

        <!-- Footer -->
        <footer class="bg-pink-100/60 py-3 text-center border-t border-pink-100 mt-6">
            <p class="text-xs text-pink-600 flex items-center justify-center gap-1 font-medium">
                <i class="fa-solid fa-heart text-[10px]"></i> MIORI STUDIO <i class="fa-solid fa-heart text-[10px]"></i>
            </p>
        </footer>

    </div>

</body>
</html>
